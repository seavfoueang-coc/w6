<!DOCTYPE html>
<html lang="en">
<head>
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="form-card">
    <h1>Student Registration</h1>
    <p>Please complete the form below.</p>

    <form action="#" method="post">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a password" required>
      </div>

      <div class="field">
        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="15" max="100" placeholder="Enter your age">
      </div>

      <fieldset>
        <legend>Gender</legend>
        <div class="choices">
          <input type="radio" id="male" name="gender" value="male">
          <label for="male">Male</label>
          <input type="radio" id="female" name="gender" value="female">
          <label for="female">Female</label>
        </div>
      </fieldset>

      <div class="field">
        <label for="birthdate">Birthdate</label>
        <input type="date" id="birthdate" name="birthdate">
      </div>

      <div class="field">
        <label for="country">Country</label>
        <select id="country" name="country" required>
          <option value="">Choose your country</option>
          <option value="cambodia">Cambodia</option>
          <option value="thailand">Philippines</option>
          <option value="vietnam">Vietnam</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="field">
        <label for="message">Short introduction</label>
        <textarea id="message" name="message" rows="4" placeholder="Tell us about yourself"></textarea>
      </div>

      <div class="check-row">
        <input type="checkbox" id="newsletter" name="newsletter">
        <label for="newsletter">Subscribe to the newsletter</label>
      </div>

      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
